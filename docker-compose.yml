services:
  backend:
    build: ./backend
    ports:
      - "8018:8018"
    environment:
      - APP_ENV=local
  frontend:
    build: ./frontend
    ports:
      - "5198:5198"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8018
    depends_on:
      - backend
